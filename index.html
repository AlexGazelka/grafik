<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Общий график</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1d1d1b;--mut:#76766f;--bd:#e3e3dc;--free:#d6f0dc;--freebd:#4aa862;--acc:#2f6fed}
:root[data-theme="dark"]{--bg:#161615;--card:#222221;--tx:#f0f0ec;--mut:#9a9a92;--bd:#34342f;--free:#1f3d27;--acc:#6b9bff}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#161615;--card:#222221;--tx:#f0f0ec;--mut:#9a9a92;--bd:#34342f;--free:#1f3d27;--acc:#6b9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.w{max-width:520px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0}
button{font:inherit;color:var(--tx);cursor:pointer}
.inv{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:7px 12px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:5px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{font-size:17px;text-transform:capitalize}
.nb{border:1px solid var(--bd);background:var(--card);border-radius:10px;width:40px;height:36px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--mut)}
.d{background:var(--card);border:1px solid var(--bd);border-radius:10px;min-height:54px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:14px}
.d.e{visibility:hidden}.d.t{font-weight:700;color:var(--acc)}.d.s{outline:2px solid var(--acc)}.d.f{background:var(--free);border-color:var(--freebd)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:10px}
.ic{line-height:0;border-bottom:2px solid;padding-bottom:1px}.ic .i{width:14px;height:14px}
.i{width:1.15em;height:1.15em;vertical-align:-.2em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px}
.card h2{font-size:15px;margin:0 0 8px}
.row{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:14px}
.row i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.mut{color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.seg button{border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:9px 4px;font-size:14px}
.seg button.on{border-color:var(--acc);background:var(--acc);color:#fff}
input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;margin-top:6px}
.leg{font-size:12px;color:var(--mut);margin-top:10px}
#err{display:none;background:#fde8e8;color:#9b1c1c;border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px}
</style>
</head>
<body>
<div class="w">
<div class="top"><h1>Общий график</h1><button class="inv" onclick="invite()">Пригласить</button></div>
<div id="err"></div>
<div class="chips" id="chips"></div>
<div class="nav"><button class="nb" onclick="mv(-1)">‹</button><b id="mt"></b><button class="nb" onclick="mv(1)">›</button></div>
<div class="g" id="g"></div>
<div class="leg"><span id="lg"></span><span style="background:var(--free);padding:0 6px;border-radius:4px">зелёный</span> — выходной у всех</div>
<div class="card" id="day"></div>
</div>
<script>
// ====== НАСТРОЙКИ: заполни после создания Supabase и бота ======
var CFG={
  SUPABASE_URL:'https://zybynztbyxhykgejdwzl.supabase.co',   // например https://abcd1234.supabase.co
  SUPABASE_KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5YnluenRieXhoeWtnZWpkd3psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NjQ5OTIsImV4cCI6MjEwODI0MDk5Mn0.Zj50jnopp-cOUkmdEEcFKz9br7DYg91CHUvpZb4SrZ8',  // anon public key
  BOT:'GrafikGazelFrendikiBOT',            // имя бота без @, например my_grafik_bot
  APP:''             // короткое имя мини-приложения из BotFather (/newapp)
};
// ================================================================
var tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();if(tg.colorScheme)document.documentElement.setAttribute('data-theme',tg.colorScheme)}
function svg(b){return '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+b+'</svg>'}
var ICO={day:svg('<circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),night:svg('<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/><path d="M18 2.5l.8 1.7 1.7.8-1.7.8L18 7.5l-.8-1.7-1.7-.8 1.7-.8z" fill="currentColor" stroke-width="1"/>'),off:svg('<path d="M3 11.5l9-8 9 8"/><path d="M5.5 10v10.5h13V10"/><path d="M10 20.5v-6h4v6"/>')};
var COL=['#e5484d','#2f6fed','#2fa84f','#e08a00','#9b51e0','#0aa5b5','#d6409f'];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
function rnd(){var a=new Uint8Array(8);crypto.getRandomValues(a);return Array.from(a,function(x){return (x%36).toString(36)}).join('')+Date.now().toString(36).slice(-3)}
var u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
var me=u?{id:u.id,name:u.first_name||'Без имени'}:{id:Number(ls('uid'))||(function(){var n=Math.floor(Math.random()*1e9)+1;ls('uid',n);return n})(),name:'Я'};
var sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||new URLSearchParams(location.search).get('g');
var grp=sp||ls('grp')||rnd();ls('grp',grp);
var S={members:[],ent:{},m:new Date(),sel:null};S.m.setDate(1);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function k(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function err(t){var e=document.getElementById('err');e.style.display=t?'block':'none';e.textContent=t||''}
function rpc(fn,args){return fetch(CFG.SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+CFG.SUPABASE_KEY},body:JSON.stringify(args)}).then(function(r){if(!r.ok)throw new Error('Ошибка сервера '+r.status);return r.text()}).then(function(t){return t?JSON.parse(t):null})}
function load(){
  var y=S.m.getFullYear(),m=S.m.getMonth(),a=new Date(y,m,-6),b=new Date(y,m+1,7);
  return rpc('tg_get',{p_grp:grp,p_from:k(a),p_to:k(b)}).then(function(d){
    S.members=d.members;S.ent={};d.entries.forEach(function(e){(S.ent[e.id]=S.ent[e.id]||{})[e.day]=e});err('');
    var f=document.activeElement;if(!(f&&f.tagName==='INPUT'))draw()
  }).catch(function(e){err('Не удалось загрузить данные. '+e.message)})
}
function mv(n){S.m=new Date(S.m.getFullYear(),S.m.getMonth()+n,1);draw();load()}
function sel(key){S.sel=key;draw()}
function mine(key){return (S.ent[me.id]||{})[key]}
function push(key){var o=mine(key)||{};
  rpc('tg_set',{p_grp:grp,p_id:me.id,p_day:key,p_t:o.t||'',p_shift:o.shift||'',p_note:o.note||''}).catch(function(e){err('Не удалось сохранить. '+e.message)})}
function setT(t){var key=S.sel;S.ent[me.id]=S.ent[me.id]||{};
  if(!t){delete S.ent[me.id][key]}else{var o=S.ent[me.id][key]||{id:me.id,day:key};o.t=t;S.ent[me.id][key]=o}
  if(tg&&tg.HapticFeedback)tg.HapticFeedback.selectionChanged();push(key);draw()}
function setF(f,v){var o=mine(S.sel);if(!o)return;o[f]=v;push(S.sel);draw()}
function link(){return CFG.BOT&&CFG.APP?'https://t.me/'+CFG.BOT+'/'+CFG.APP+'?startapp='+grp:null}
function invite(){var l=link();
  if(!l){err('Укажи BOT и APP в настройках index.html, чтобы появилась ссылка-приглашение. Код группы: '+grp);return}
  var t='Присоединяйся к нашему общему графику';
  if(tg)tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(l)+'&text='+encodeURIComponent(t));
  else if(navigator.clipboard){navigator.clipboard.writeText(l);err('Ссылка скопирована: '+l)}}
function who(id){return S.members.filter(function(p){return p.id===id})[0]}
function col(p){return COL[p.color%COL.length]}
function draw(){
  document.getElementById('lg').innerHTML=ICO.day+' дневная &nbsp; '+ICO.night+' ночная &nbsp; '+ICO.off+' выходной &nbsp; ';
  document.getElementById('chips').innerHTML=S.members.map(function(p){return '<span class="chip"><i style="background:'+col(p)+'"></i>'+esc(p.name)+(p.id===me.id?' (я)':'')+'</span>'}).join('');
  document.getElementById('mt').textContent=S.m.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  var y=S.m.getFullYear(),m=S.m.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),today=k(new Date());
  var h=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(function(d){return '<div class="wd">'+d+'</div>'}).join('');
  for(var i=0;i<first;i++)h+='<div class="d e"></div>';
  for(var d=1;d<=n;d++){var key=k(new Date(y,m,d)),offs=0;
    var dots=S.members.map(function(p){var o=(S.ent[p.id]||{})[key];if(!o)return '';if(o.t==='off')offs++;
      return '<span class="ic" style="border-color:'+col(p)+'">'+ICO[o.t]+'</span>'}).join('');
    var free=S.members.length>1&&offs===S.members.length;
    h+='<div class="d'+(key===today?' t':'')+(key===S.sel?' s':'')+(free?' f':'')+'" onclick="sel(\''+key+'\')"><span>'+d+'</span><span class="dots">'+dots+'</span></div>'}
  document.getElementById('g').innerHTML=h;dayCard()}
function dayCard(){
  var c=document.getElementById('day');
  if(!S.sel){c.innerHTML='<span class="mut">Нажми на день, чтобы отметить смену или выходной</span>';return}
  var dt=new Date(S.sel+'T00:00:00'),o=mine(S.sel)||{};
  var rows=S.members.map(function(p){var q=(S.ent[p.id]||{})[S.sel];
    var st=!q?'<span class="mut">нет данных</span>':(q.t==='off'?ICO.off+' Выходной':(q.t==='night'?ICO.night+' Ночная':ICO.day+' Дневная')+(q.shift?' · '+esc(q.shift):''))+(q.note?' — «'+esc(q.note)+'»':'');
    return '<div class="row"><i style="background:'+col(p)+'"></i><div><b>'+esc(p.name)+'</b> '+st+'</div></div>'}).join('');
  c.innerHTML='<h2>'+dt.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})+'</h2>'+rows+
  '<h2 style="margin-top:12px">Мой день</h2>'+
  '<div class="seg"><button class="'+(o.t==='day'?'on':'')+'" onclick="setT(\'day\')">'+ICO.day+' День</button><button class="'+(o.t==='night'?'on':'')+'" onclick="setT(\'night\')">'+ICO.night+' Ночь</button><button class="'+(o.t==='off'?'on':'')+'" onclick="setT(\'off\')">'+ICO.off+' Выходной</button><button onclick="setT(\'\')">Сброс</button></div>'+
  ((o.t==='day'||o.t==='night')?'<input placeholder="Время смены, например 09:00–18:00" value="'+esc(o.shift||'')+'" onchange="setF(\'shift\',this.value)">':'')+
  (o.t?'<input placeholder="Пометка, например «можем встретиться?»" value="'+esc(o.note||'')+'" onchange="setF(\'note\',this.value)">':'')}
draw();
if(!CFG.SUPABASE_URL||!CFG.SUPABASE_KEY){err('Не заполнены настройки Supabase в начале скрипта (CFG).')}
else{rpc('tg_join',{p_grp:grp,p_id:me.id,p_name:me.name}).then(load).catch(function(e){err('Не удалось подключиться. '+e.message)});
  setInterval(load,15000);document.addEventListener('visibilitychange',function(){if(!document.hidden)load()})}
</script>
</body>
</html>
